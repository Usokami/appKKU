appId: com.appkku.tarotstudyroulette
productName: Tarot Study Roulette
directories:
  output: release
files:
  - dist/**/*
  - package.json
npmRebuild: true
win:
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Education

